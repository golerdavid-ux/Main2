name = "money-book"
compatibility_date = "2024-09-01"

# The React build output directory
pages_build_output_dir = "frontend/build"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "money-book-db"
database_id = "" # Will be filled by deploy script

# R2 Bucket binding for photo storage
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "money-book-photos"
