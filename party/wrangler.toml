name = "party-planning"
compatibility_date = "2024-09-01"

# The React build output directory
pages_build_output_dir = "frontend/build"

# D1 Database binding
# For local dev the database_id can be any placeholder UUID;
# deploy.sh will replace it with the real ID on first deploy.
[[d1_databases]]
binding = "DB"
database_name = "party-planning-db"
database_id = "6abf5234-de2d-4141-b858-cb932c3b5e0b"

# R2 Bucket binding for inspiration photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "party-planning-photos"
